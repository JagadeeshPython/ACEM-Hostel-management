<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Holidays</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            padding: 40px 20px;
        }

        .holiday-container {
            max-width: 1100px;
            margin: auto;
        }

        .page-title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 600;
        }

        .holiday-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .holiday-table thead {
            background: #3498db;
            color: white;
        }

        .holiday-table th {
            padding: 16px;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .holiday-table td {
            padding: 15px;
            color: #444;
        }

        .holiday-table tbody tr {
            border-bottom: 1px solid #eaeaea;
            transition: all 0.3s ease;
        }

        .holiday-table tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .holiday-table tbody tr:hover {
            background-color: #eaf4ff;
            transform: scale(1.002);
        }

        .holiday-table tbody tr:last-child {
            border-bottom: none;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            display: inline-block;
        }

        .national {
            background-color: #27ae60;
        }

        .festival {
            background-color: #f39c12;
        }

        .hostel {
            background-color: #3498db;
        }

        .emergency {
            background-color: #e74c3c;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #888;
            font-style: italic;
        }

        @media screen and (max-width: 768px) {

            .holiday-table,
            .holiday-table thead,
            .holiday-table tbody,
            .holiday-table th,
            .holiday-table td,
            .holiday-table tr {
                display: block;
            }

            .holiday-table thead {
                display: none;
            }

            .holiday-table tr {
                background: white;
                margin-bottom: 15px;
                border-radius: 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
                padding: 10px;
            }

            .holiday-table td {
                border: none;
                position: relative;
                padding-left: 50%;
                text-align: right;
            }

            .holiday-table td::before {
                position: absolute;
                left: 15px;
                width: 45%;
                text-align: left;
                font-weight: bold;
                color: #333;
            }

            .holiday-table td:nth-of-type(1)::before {
                content: "Holiday Name";
            }

            .holiday-table td:nth-of-type(2)::before {
                content: "Type";
            }

            .holiday-table td:nth-of-type(3)::before {
                content: "From";
            }

            .holiday-table td:nth-of-type(4)::before {
                content: "To";
            }
        }
    </style>
</head>
<body>

<div class="holiday-container">

    <h1 class="page-title">Upcoming Holidays</h1>

    <table class="holiday-table">
        <thead>
            <tr>
                <th>Holiday Name</th>
                <th>Type</th>
                <th>From Date</th>
                <th>To Date</th>
            </tr>
        </thead>

        <tbody>
            {% for holiday in holidays %}
            <tr>
                <td>{{ holiday.title }}</td>

                <td>
                    <span class="badge {{ holiday.holiday_type }}">
                        {{ holiday.get_holiday_type_display }}
                    </span>
                </td>

                <td>{{ holiday.start_date }}</td>
                <td>{{ holiday.end_date }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="no-data">
                    No upcoming holidays available.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h3>Write your Complaint</h3>
    <form method="post">
        <form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label>Subject</label>
        <input type="text"
               name="sub"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label>Complaint</label>
        <textarea name="msg"
                  class="form-control"
                  rows="4"
                  required></textarea>
    </div>

    <button type="submit"
            class="btn btn-primary">
        Submit Complaint
    </button>
</form>
</div>
</body>
</html>

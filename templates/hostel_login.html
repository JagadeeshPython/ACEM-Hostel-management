<!DOCTYPE html>
<html>
<head>
    <title>Hostel Incharge Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #198754, #20c997);
            font-family:'Segoe UI', sans-serif;
        }

        .login-card{
            width:100%;
            max-width:450px;
            border:none;
            border-radius:20px;
            overflow:hidden;
            backdrop-filter: blur(10px);
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header{
            padding:25px;
            text-align:center;
            background:linear-gradient(135deg,#198754,#157347);
            border:none;
        }

        .card-header h3{
            margin:0;
            font-weight:600;
            letter-spacing:0.5px;
        }

        .card-body{
            background:white;
            padding:35px;
        }

        .form-label{
            font-weight:600;
            color:#444;
        }

        .form-control{
            height:50px;
            border-radius:10px;
            border:1px solid #ced4da;
            transition:all 0.3s ease;
        }

        .form-control:focus{
            border-color:#198754;
            box-shadow:0 0 10px rgba(25,135,84,0.2);
        }

        .btn-login{
            height:50px;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            background:#198754;
            border:none;
            transition:0.3s ease;
        }

        .btn-login:hover{
            background:#157347;
            transform:translateY(-2px);
        }

        .login-icon{
            font-size:60px;
            color:white;
            margin-bottom:10px;
        }

        .subtitle{
            color:#6c757d;
            text-align:center;
            margin-bottom:25px;
            font-size:14px;
        }

        @media(max-width:576px){

            .card-body{
                padding:25px;
            }

            .login-card{
                margin:15px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card login-card">

                <div class="card-header text-white">

                    <div class="login-icon">
                        🏨
                    </div>

                    <h3>Hostel Incharge Login</h3>

                </div>

                <div class="card-body">

                    <p class="subtitle">
                        Sign in to access the Hostel Management Dashboard
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter Username"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter Password"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-login text-white w-100">

                            Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

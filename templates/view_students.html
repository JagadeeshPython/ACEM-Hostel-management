{% extends 'templates/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Hostel Students</h2>

    <table class="table">
    <tr>
        <th>Photo</th>
        <th>Name</th>
        <th>Room</th>
        <th>Phone</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>
            {% if student.photo %}
                <img src="{{ student.photo.url }}"
                     width="70"
                     height="70"
                     style="object-fit:cover;border-radius:50%;">
            {% endif %}
        </td>

        <td>{{ student.name }}</td>
        <td>{{ student.room_no }}</td>
        <td>{{ student.phone }}</td>
    </tr>
    {% endfor %}
</table>

</div>

{% endblock %}

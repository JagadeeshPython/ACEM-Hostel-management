{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEM Hostel Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f9f5f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .login-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .login-header img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-login {
            border-radius: 10px;
            padding: 10px;
        }

        .footer-text {
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

<div class="card shadow-lg login-card">

    <div class="login-header">
        <img src="{% static 'images/newlogo.PNG' %}" alt="ACEM Logo">
        <h3>ACEM Hostel Management System</h3>
        <p class="mb-0">Student & Hostel Incharge Login</p>
    </div>

    <div class="card-body p-4">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter Username"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required>
            </div>

            <div class="d-grid">
                <button
                    type="submit"
                    class="btn btn-primary btn-login">
                    Login
                </button>
            </div>

        </form>

        <hr>

        <div class="text-center footer-text">
            <p>
                ACEM Hostel Management System
            </p>
            <p>
                Secure access for Students and Hostel Incharge
            </p>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

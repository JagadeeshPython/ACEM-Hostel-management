<!-- templates/header.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management System</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-navbar {
            background-color: #1e3a8a; /* Dark Blue */
        }

        .custom-navbar .navbar-brand,
        .custom-navbar .nav-link {
            color: white !important;
            font-weight: 500;
        }

        .custom-navbar .nav-link:hover {
            color: #ffd700 !important; /* Gold */
        }

        .custom-navbar .navbar-brand:hover {
            color: #ffd700 !important;
        }

        .navbar-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg custom-navbar shadow">
        <div class="container">

            <!-- Logo -->
            <img src="/static/images/newlogo.PNG"
                 alt="ACEM Hostel Logo"
                 class="navbar-logo">

            <!-- Brand Name -->
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                ACEM Hostel
            </a>

            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler bg-light" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navMenu"
                    aria-controls="navMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Menu -->
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'rent' %}">
                            <i class="fas fa-bed me-1"></i> Rooms & Facilities
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'services' %}">
                            <i class="fas fa-concierge-bell me-1"></i> Services
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'contact' %}">
                            <i class="fas fa-envelope me-1"></i> Contact
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'student_login' %}">
                            Student Login
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'hostel_login' %}">
                            Hostel Incharge Login
                        </a></li>
                    <a href="{% url 'holiday_list' %}" class="btn btn-warning btn-lg px-4">
                    <i class="fas fa-calendar-alt"></i>
        Holidays
    </a>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
